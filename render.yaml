databases:
  - name: stripe-db
    plan: free
    databaseName: stripe_payment
    user: stripe_user

services:
  - type: web
    name: stripe-payment
    plan: free
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn stripe_payment.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stripe-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
